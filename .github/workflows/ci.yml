name: PHP CI

on:
  push:
    branches: [main, php-backend-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hendy
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: hendy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hendy -d hendy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hendy:ci-only-password@127.0.0.1:5432/hendy_test
      DATABASE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring, pdo, pdo_pgsql
          coverage: none

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find app public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHP tests
        run: php tests/run.php

      - name: Run PostgreSQL migration and smoke tests
        run: |
          php bin/migrate.php
          php tests/database-smoke.php

      - name: Smoke test feature scaffold
        run: |
          php scripts/scaffold-feature.php --name ci-smoke-check --category api --description "CI scaffold test"
          php -l app/features/ci-smoke-check/CiSmokeCheckFeature.php

      - name: Build Docker image
        run: docker build --pull -t hendy-bot-tele:ci .

      - name: Verify bot token configuration names
        run: |
          grep -q '^BOT1_TOKEN=' .env.example
          grep -q '^BOT2_TOKEN=' .env.example
          ! grep -Eq '^(BOTCHINH_TOKEN|BOTPHU_TOKEN|BOT_TOKEN|BOT_SECOND_TOKEN)=' .env.example

      - name: Verify deployment files
        run: |
          test -s Dockerfile
          test -s render.yaml
          test -s database/schema.sql
