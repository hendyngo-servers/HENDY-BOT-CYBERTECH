name: Scaffold feature branch
on:
  workflow_dispatch:
    inputs:
      feature_name:
        description: "Tên feature dạng kebab-case"
        required: true
        type: string
      category:
        description: "Nơi tạo scaffold"
        required: true
        type: choice
        options: [api, bot, mini-app]
      description:
        description: "Mô tả feature"
        required: false
        type: string
        default: "Scaffold generated by GitHub Actions"
permissions:
  contents: write
  pull-requests: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate disabled feature
        env:
          FEATURE_NAME: ${{ inputs.feature_name }}
          FEATURE_CATEGORY: ${{ inputs.category }}
          FEATURE_DESCRIPTION: ${{ inputs.description }}
        run: |
          node scripts/scaffold-feature.js \
            --name "$FEATURE_NAME" \
            --category "$FEATURE_CATEGORY" \
            --description "$FEATURE_DESCRIPTION"
      - name: Open review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: scaffold/${{ inputs.feature_name }}
          delete-branch: true
          commit-message: "chore(scaffold): add generated feature"
          title: "Scaffold feature: ${{ inputs.feature_name }}"
          body: |
            Scaffold ở trạng thái disabled. Review quyền truy cập, API, D1 migration và tests trước khi bật.
