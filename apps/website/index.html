<style>
:root{
  color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#080b18;--panel:#10162a;--muted:#9ba8c6;--text:#f7f8ff;--line:#26314d;
  --c1:#ff4d6d;--c2:#ff8a3d;--c3:#ffd447;--c4:#4fdb8b;--c5:#35c8ef;--c6:#7b7cff;--c7:#d66bff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --tg-safe-top:0px;--tg-safe-bottom:0px;--tg-content-safe-top:0px;--tg-content-safe-bottom:0px;
  --tg-viewport-stable-height:100dvh;
  --tg-accent:#35c8ef;
}
*{box-sizing:border-box}html{background:var(--bg);min-height:100%;overscroll-behavior-y:contain}body{margin:0;min-height:var(--tg-viewport-stable-height,100dvh);color:var(--text);background:radial-gradient(ellipse at 8% -10%,#39204a 0,transparent 34%),radial-gradient(ellipse at 100% 10%,#123d54 0,transparent 30%),var(--bg);padding:calc(var(--safe-top) + var(--tg-safe-top) + var(--tg-content-safe-top)) 0 calc(82px + var(--safe-bottom) + var(--tg-safe-bottom) + var(--tg-content-safe-bottom));overscroll-behavior-y:contain;transition:background-color .18s,color .18s}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}
.shell{width:min(100%,980px);margin:auto;padding:16px 14px 32px;min-height:calc(var(--tg-viewport-stable-height,100dvh) - var(--tg-safe-top) - var(--tg-content-safe-top) - var(--tg-safe-bottom) - var(--tg-content-safe-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,var(--c1),var(--c5),var(--c7));box-shadow:0 0 32px #b35cff55;animation:brand-glow 4s ease-in-out infinite}
.brand strong{display:block;font-size:18px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;margin-top:3px}
.bot-chip{border:1px solid #59698d;background:#111a2e;border-radius:99px;padding:8px 11px;color:#d9e7ff;font-size:11px;font-weight:800;white-space:nowrap}
.hero{position:relative;overflow:hidden;padding:23px 21px;border:1px solid #4c4674;border-radius:26px;background:linear-gradient(130deg,#1b2440eF,#211333eF 56%,#101c31);box-shadow:0 18px 60px #0007}

.hero-content{position:relative;z-index:1}

.hero h1{font-size:clamp(25px,6vw,43px);line-height:1.05;margin:14px 0 9px;letter-spacing:-.04em}
.gradient-text{background:linear-gradient(90deg,var(--c3),var(--c1),var(--c7),var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:240% 100%;animation:rainbow 7s linear infinite}
.hero p{max-width:650px;color:#bac6df;font-size:13px;line-height:1.65;margin:0}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.btn{border:1px solid #52628e;border-radius:13px;padding:11px 15px;background:#202b49;color:white;font-weight:850;font-size:12px}
.btn.primary{border:0;background:linear-gradient(105deg,#6b50e9,#1caacb);box-shadow:0 8px 26px #5e51e955}
.wallets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0 22px}
.wallet{border:1px solid var(--line);border-radius:17px;padding:14px 12px;background:linear-gradient(150deg,#141d34,#0d1324);min-width:0}
.wallet small{display:block;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
.wallet b{display:block;font-size:clamp(14px,3vw,20px);margin-top:7px;overflow-wrap:anywhere}
.wallet:nth-child(1){border-color:#6e394b}.wallet:nth-child(2){border-color:#2a6873}.wallet:nth-child(3){border-color:#64538b}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:22px 2px 12px}
.section-heading h2{margin:0;font-size:16px;letter-spacing:.02em}.section-heading span{font-size:11px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.tile{position:relative;isolation:isolate;overflow:hidden;min-height:118px;border:1px solid var(--tile-border);border-radius:20px;text-align:left;padding:15px;background:linear-gradient(145deg,var(--tile-bg),#11172a 78%);box-shadow:0 12px 28px #0005;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;animation:tile-in .55s both;animation-delay:calc(var(--i,0)*45ms)}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,var(--tile-glow),transparent 56%);opacity:.16;z-index:-1}
.tile:after{content:"";position:absolute;width:115px;height:115px;right:-45px;bottom:-65px;border-radius:50%;background:var(--tile-glow);filter:blur(26px);opacity:.22;z-index:-1}
.tile:nth-child(even){transform:translateY(13px)}
.tile:hover,.tile:focus-visible{transform:translateY(-3px) scale(1.01);border-color:var(--tile-glow);box-shadow:0 15px 36px #0008,0 0 25px color-mix(in srgb,var(--tile-glow) 27%,transparent);outline:none}
.tile:nth-child(even):hover{transform:translateY(9px) scale(1.01)}
.tile-wide{grid-column:1/-1;min-height:104px}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tile-icon{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--tile-glow) 18%,#0c1324);border:1px solid color-mix(in srgb,var(--tile-glow) 48%,transparent);font-size:25px;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--tile-glow) 50%,transparent))}
.tile h3{font-size:13px;line-height:1.25;margin:12px 0 4px;font-weight:950;letter-spacing:.015em}
.tile p{font-size:10px;line-height:1.45;color:#adb9d2;margin:0}
.tile .arrow{color:var(--tile-glow);font-size:17px;font-weight:900}
.tile:nth-child(7n+1){--tile-bg:#24152b;--tile-glow:var(--c1);--tile-border:#77324f}
.tile:nth-child(7n+2){--tile-bg:#2a1d17;--tile-glow:var(--c2);--tile-border:#74482f}
.tile:nth-child(7n+3){--tile-bg:#292716;--tile-glow:var(--c3);--tile-border:#71632c}
.tile:nth-child(7n+4){--tile-bg:#142a25;--tile-glow:var(--c4);--tile-border:#28694f}
.tile:nth-child(7n+5){--tile-bg:#132a34;--tile-glow:var(--c5);--tile-border:#27647b}
.tile:nth-child(7n+6){--tile-bg:#1c1e38;--tile-glow:var(--c6);--tile-border:#484d8e}
.tile:nth-child(7n){--tile-bg:#2b1936;--tile-glow:var(--c7);--tile-border:#79438e}
.motion{display:inline-block;transform-origin:center}
.motion-rocket{animation:rocket 2.2s ease-in-out infinite}
.motion-tool{animation:tool 3.5s ease-in-out infinite}
.motion-gift{animation:gift 2.8s ease-in-out infinite}
.motion-wallet{animation:pulse 2.2s ease-in-out infinite}
.motion-game{animation:game 2.7s ease-in-out infinite}
.motion-chat{animation:bounce 2.5s ease-in-out infinite}
.motion-gem{animation:gem 3s ease-in-out infinite}
.motion-bell{animation:ring 3.2s ease-in-out infinite}
.motion-code{animation:flip 3.2s ease-in-out infinite}
.panel{border:1px solid var(--line);border-radius:20px;padding:16px;background:linear-gradient(150deg,#141c31,#0d1323);margin-top:14px}
.panel h3{margin:0 0 12px;font-size:15px}.muted{color:var(--muted)}.small{font-size:11px}
.product-list{display:grid;gap:10px}
.product{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px;border:1px solid #2a3653;border-radius:15px;background:#0d1426}
.product b{font-size:13px}.product small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.product .price{font-size:13px;color:#fff;font-weight:950;white-space:nowrap}
.product-actions{display:flex;align-items:center;gap:8px;margin-top:9px}
.field{width:100%;border:1px solid #344363;background:#0a1020;color:white;border-radius:12px;padding:12px;margin:6px 0 10px;outline:none}
.field:focus{border-color:var(--c5);box-shadow:0 0 0 3px #35c8ef22}
.form-label{display:block;color:#b9c5de;font-size:11px;font-weight:800;margin-top:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #27324c}
.row-card:last-child{border-bottom:0}
.status{display:inline-flex;border-radius:99px;padding:5px 8px;background:#1b2940;color:#a9dfff;font-size:10px;font-weight:900}
.qr{display:block;max-width:240px;width:100%;height:auto;max-height:240px;object-fit:contain;margin:12px auto;border-radius:12px;background:white;padding:8px}
.notice{padding:12px 13px;background:#18233b;border:1px solid #344b70;border-radius:13px;color:#d6e3ff;font-size:12px;line-height:1.55}
.notice.error{border-color:#864653;background:#311a26;color:#ffd8dc}
.notice.success{border-color:#267450;background:#122b25;color:#c6ffdf}
.back{margin:0 0 12px;background:transparent;border:0;color:#c7d8ff;font-size:12px;font-weight:850}
.bottom-nav{position:fixed;z-index:9;left:0;right:0;bottom:0;padding:10px 14px calc(10px + var(--safe-bottom) + var(--tg-safe-bottom) + var(--tg-content-safe-bottom));background:#0a1023eF;border-top:1px solid #293756;backdrop-filter:blur(18px)}
.nav-inner{display:flex;max-width:760px;margin:auto;justify-content:space-around;gap:8px}
.nav-btn{border:0;background:transparent;color:#9aa9c6;border-radius:12px;padding:7px 9px;min-width:64px;font-size:10px;font-weight:850}
.nav-btn span{display:block;font-size:19px;margin-bottom:3px}.nav-btn.active{color:white;background:#202d4c}
.loading{padding:22px;text-align:center;color:var(--muted)}
.toast{position:fixed;z-index:20;bottom:calc(88px + var(--safe-bottom) + var(--tg-safe-bottom) + var(--tg-content-safe-bottom));left:50%;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#f1f4ff;color:#10152a;padding:11px 16px;border-radius:13px;font-size:12px;font-weight:900;box-shadow:0 10px 30px #0008;transition:.2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes rocket{0%,100%{transform:translate(0,0) rotate(-7deg)}45%{transform:translate(3px,-7px) rotate(5deg)}60%{transform:translate(-1px,-4px) rotate(0)}}
@keyframes tool{0%,100%{transform:rotate(0)}30%{transform:rotate(-17deg)}60%{transform:rotate(17deg)}}
@keyframes gift{0%,100%{transform:rotate(0) scale(1)}40%{transform:rotate(-8deg) scale(1.12)}65%{transform:rotate(8deg) scale(1.06)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes game{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-5px) rotate(-8deg)}70%{transform:translateY(1px) rotate(8deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}
@keyframes gem{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(12deg) scale(1.13)}}
@keyframes ring{0%,75%,100%{transform:rotate(0)}78%{transform:rotate(15deg)}82%{transform:rotate(-15deg)}86%{transform:rotate(10deg)}90%{transform:rotate(-6deg)}}
@keyframes flip{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}
@keyframes tile-in{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes brand-glow{0%,100%{box-shadow:0 0 20px #ff4d6d33}50%{box-shadow:0 0 35px #d66bff77}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rainbow{to{background-position:240% 0}}
@media(min-width:720px){.shell{padding:25px 24px 42px}.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tile-wide{grid-column:span 2}.tile:nth-child(even){transform:translateY(16px)}.tile:nth-child(3n){transform:translateY(27px)}.tile:nth-child(even):hover,.tile:nth-child(3n):hover{transform:translateY(8px) scale(1.01)}.hero{padding:30px}.wallets{gap:14px}.wallet{padding:17px}}
@media(max-width:390px){.shell{padding-left:10px;padding-right:10px}.wallet{padding:11px 9px}.tile{padding:12px;min-height:110px}.tile-icon{width:39px;height:39px;font-size:22px}.tile h3{font-size:12px}}

.hendy-showcase{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(230px,.9fr);align-items:center;gap:6px;min-height:340px}
.orbit-stage{position:relative;width:min(100%,360px);aspect-ratio:1;margin:0 auto;display:grid;place-items:center;isolation:isolate}
.orbit-ring{position:absolute;left:50%;top:50%;border:1px dashed #8290c455;border-radius:50%;transform:translate(-50%,-50%);animation:orbit 22s linear infinite}

@keyframes core-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}

.hero.website-login-hero{margin-bottom:18px}
@media(max-width:720px){.hendy-showcase{grid-template-columns:1fr;min-height:0}.orbit-stage{width:min(82vw,280px);grid-row:1;margin:2px auto 10px}.hero-content{grid-row:2}.orbit-node{width:42px;height:42px;font-size:22px}}
@media(prefers-reduced-motion:reduce){.orbit-ring,.orbit-core,.orbit-node{animation:none!important}}

/* HENDY Customer Center — reference-inspired member portal */

<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">💠</div>
      <div><strong>HENDY <span class="gradient-text">DIGITAL</span></strong><small>TECHNOLOGY · LIVE · SERVICES</small></div>
    </div>
    <div id="bot-chip" class="bot-chip">BOT · ĐANG KẾT NỐI</div>
  </header>
  <main id="app"><div class="loading">🌈 Đang khởi tạo HENDY Website...</div></main>
</div>
<nav class="bottom-nav" aria-label="Điều hướng chính">
  <div class="nav-inner">
    <button class="nav-btn active" data-nav="home"><span>🏠</span>Trang chủ</button>
    <button class="nav-btn" data-nav="services"><span>🚀</span>Dịch vụ</button>
    <button class="nav-btn" data-nav="wallet"><span>💳</span>Ví tiền</button>
    <button class="nav-btn" data-nav="customer"><span>👤</span>Khách hàng</button>
  </div>
</nav>
<div id="toast" class="toast"></div>
<script>
(() => {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const params = new URLSearchParams(window.location.search);
  const savedBotKey = !params.has('bot') ? localStorage.getItem('hendy_bot_key') : '';
  const botKey = params.get('bot') === 'secondary' || (!params.has('bot') && savedBotKey === 'secondary') ? 'secondary' : 'primary';
  const state = { boot:null, center:null, section:'home', products:[], payment:null, accounts:[], referrals:null, vip:null, lastAction:null };
  let realtimeSocket=null;
  let realtimeRetry=null;
  let realtimeHeartbeat=null;
  let realtimeRetryCount=0;
  let realtimeStopped=false;
  let realtimeRefreshing=false;
  const $ = (selector, root=document) => root.querySelector(selector);
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const money = value => new Intl.NumberFormat('vi-VN').format(Number(value || 0)) + 'đ';

  function hapticImpact(style='light'){
    try{if(typeof tg?.HapticFeedback?.impactOccurred==='function')tg.HapticFeedback.impactOccurred(style);}catch(_){}
  }
  function hapticSelection(){
    try{if(typeof tg?.HapticFeedback?.selectionChanged==='function')tg.HapticFeedback.selectionChanged();}catch(_){}
  }
  function hapticNotification(kind='success'){
    try{
      if(typeof tg?.HapticFeedback?.notificationOccurred==='function')tg.HapticFeedback.notificationOccurred(kind);
      else hapticImpact(kind==='error'?'heavy':'light');
    }catch(_){}
  }
  const safeColor = value => typeof value==='string' && /^#[0-9a-f]{6}$/i.test(value) ? value : '';
  function applyTelegramTheme(){
    if(!tg)return;
    const theme=tg.themeParams||{};
    const root=document.documentElement;
    const map={
      '--bg':theme.bg_color,
      '--panel':theme.secondary_bg_color,
      '--text':theme.text_color,
      '--muted':theme.hint_color,
      '--line':theme.section_separator_color,
      '--tg-accent':theme.button_color
    };
    for(const [name,value] of Object.entries(map)){
      const color=safeColor(value);if(color)root.style.setProperty(name,color);
    }
    if(tg.colorScheme)root.dataset.telegramTheme=tg.colorScheme;
    if(tg.platform)root.dataset.telegramPlatform=tg.platform;
    try{
      tg.setHeaderColor(safeColor(theme.header_bg_color)||safeColor(theme.bg_color)||'#080b18');
      tg.setBackgroundColor(safeColor(theme.bg_color)||'#080b18');
      if(typeof tg.setBottomBarColor==='function' && safeColor(theme.bottom_bar_bg_color))tg.setBottomBarColor(theme.bottom_bar_bg_color);
    }catch(_){}
  }
  function applyTelegramViewport(){
    if(!tg)return;
    const root=document.documentElement;
    const safe=tg.safeAreaInset||{};
    const content=tg.contentSafeAreaInset||{};
    const pairs=[
      ['--tg-safe-top',safe.top],['--tg-safe-bottom',safe.bottom],
      ['--tg-content-safe-top',content.top],['--tg-content-safe-bottom',content.bottom]
    ];
    for(const [name,value] of pairs){
      const number=Number(value);if(Number.isFinite(number)&&number>=0)root.style.setProperty(name,number+'px');
    }
    const stable=Number(tg.viewportStableHeight||tg.viewportHeight||0);
    if(Number.isFinite(stable)&&stable>200)root.style.setProperty('--tg-viewport-stable-height',stable+'px');
    document.body?.classList.toggle('telegram-mini-app',Boolean(tg.initData));
  }
  function syncMiniAppControls(){
    if(!tg?.initData)return;
    const back=tg.BackButton;
    if(back){
      if(state.section && state.section!=='home' && state.section!=='website-login')back.show();
      else back.hide();
    }
    const main=tg.MainButton;
    if(!main)return;
    const wantsDeposit=state.section==='wallet' || (state.section==='customer' && state.customerTab==='deposit');
    if(wantsDeposit){
      main.setText('TẠO QR VIETQR');
      main.show();
      if(typeof main.enable==='function')main.enable();
    }else{
      main.hide();
    }
  }
  function initTelegramMiniApp(){
    if(!tg?.initData)return;
    try{tg.ready();tg.expand();}catch(_){}
    applyTelegramTheme();
    applyTelegramViewport();
    if(typeof tg.onEvent==='function'){
      tg.onEvent('themeChanged',applyTelegramTheme);
      tg.onEvent('viewportChanged',applyTelegramViewport);
      tg.onEvent('safeAreaChanged',applyTelegramViewport);
      tg.onEvent('contentSafeAreaChanged',applyTelegramViewport);
    }
    if(tg.BackButton && typeof tg.BackButton.onClick==='function'){
      tg.BackButton.onClick(()=>{hapticImpact('light');openSection('home');});
    }
    if(tg.MainButton && typeof tg.MainButton.onClick==='function'){
      tg.MainButton.onClick(async()=>{
        try{
          tg.MainButton.showProgress?.();
          await createDeposit();
          hapticNotification('success');
        }catch(error){
          showToast(error.message||'Không thể tạo yêu cầu nạp.','error');
        }finally{
          tg.MainButton.hideProgress?.();
        }
      });
    }
    syncMiniAppControls();
  }
  const showToast = (message,kind='success') => {
    const toast = $('#toast'); toast.textContent = message; toast.classList.add('show');
    hapticNotification(kind);
    window.setTimeout(() => toast.classList.remove('show'), 2600);
  };
  async function api(path, options={}) {
    const authHeaders = tg && tg.initData ? {'Authorization':'tma ' + tg.initData} : {};
    const response = await fetch(path, {
      method: options.method || 'GET',
      headers: {
        ...authHeaders,
        'X-Telegram-Bot-Key': botKey,
        ...(options.body ? {'Content-Type':'application/json'} : {}),
        ...(options.headers || {})
      },
      credentials:'same-origin',
      body: options.body ? JSON.stringify(options.body) : undefined,
      cache:'no-store'
    });
    let data={};
    try { data=await response.json(); } catch (_) { throw new Error('Máy chủ trả về dữ liệu không hợp lệ.'); }
    if (!response.ok) throw new Error(data.error || data.message || ('Yêu cầu lỗi HTTP ' + response.status));
    return data;
  }

  async function refreshWebsiteData(){
    if(realtimeRefreshing || !state.boot) return;
    realtimeRefreshing=true;
    try{
      const data=await api('/api/bootstrap');
      if(data.botKey!==botKey) return;
      state.boot=data;
      if(state.section==='home') renderHome();
      else await openSection(state.section);
      showToast('✨ Dữ liệu HENDY vừa được cập nhật.');
    }catch(error){
      console.warn('HENDY realtime refresh failed:',error.message);
    }finally{
      realtimeRefreshing=false;
    }
  }

  async function connectWebsiteRealtime(){
    if(!state.boot || realtimeStopped || realtimeSocket) return;
    try{
      const ticket=await api('/api/realtime-ticket',{method:'POST',body:{}});
      const socket=new WebSocket(ticket.url);
      realtimeSocket=socket;
      socket.addEventListener('open',()=>{
        socket.send(JSON.stringify({type:'auth',ticket:ticket.ticket}));
      });
      socket.addEventListener('message',event=>{
        let message;
        try{message=JSON.parse(event.data);}catch(_){return;}
        if(message.type==='realtime.ready'){
          realtimeRetryCount=0;
          const badge=$('#bot-chip');
          if(badge)badge.textContent='BOT '+(botKey==='secondary'?'02':'01')+' · HENDY LIVE';
          window.clearInterval(realtimeHeartbeat);
          realtimeHeartbeat=window.setInterval(()=>{
            if(realtimeSocket===socket && socket.readyState===WebSocket.OPEN)
              socket.send(JSON.stringify({type:'ping',timestamp:Date.now()}));
          },25000);
          return;
        }
        if(message.type==='pong') return;
        if(message.type==='auth.failed' || message.type==='origin.rejected') {
          const badge=$('#bot-chip');if(badge)badge.textContent='HENDY · ĐANG ĐỒNG BỘ LẠI';
          return;
        }
        if(message.type==='user.data.changed' || message.type.startsWith('admin.'))
          void refreshWebsiteData();
      });
      socket.addEventListener('close',()=>{
        if(realtimeSocket===socket)realtimeSocket=null;
        window.clearInterval(realtimeHeartbeat);realtimeHeartbeat=null;
        if(!realtimeStopped){
          realtimeRetryCount=Math.min(realtimeRetryCount+1,6);
          const delay=Math.min(30000,1000*(2**realtimeRetryCount))+Math.floor(Math.random()*400);
          window.clearTimeout(realtimeRetry);
          realtimeRetry=window.setTimeout(connectWebsiteRealtime,delay);
        }
      });
      socket.addEventListener('error',()=>{const badge=$('#bot-chip');if(badge)badge.textContent='HENDY · ĐANG KẾT NỐI';});
    }catch(error){
      if(!realtimeStopped){
        realtimeRetryCount=Math.min(realtimeRetryCount+1,6);
        const delay=Math.min(30000,1000*(2**realtimeRetryCount))+Math.floor(Math.random()*400);
        window.clearTimeout(realtimeRetry);
        realtimeRetry=window.setTimeout(connectWebsiteRealtime,delay);
      }
    }
  }

  const tileData = [
    {key:'live',icon:'🚀',motion:'motion-rocket',title:'MINIGAME LIVE',desc:'Tài khoản, liên kết và hỗ trợ đơn',section:'minigame'},
    {key:'tools',icon:'🧰',motion:'motion-tool',title:'THUÊ TOOL',desc:'Kho công cụ và thời hạn sử dụng',section:'tools'},
    {key:'codes',icon:'🎁',motion:'motion-gift',title:'MUA CODE',desc:'Mã dịch vụ và đơn hàng',section:'codes'},
    {key:'wallet',icon:'💳',motion:'motion-wallet',title:'NẠP TIỀN',desc:'Tạo yêu cầu QR VietQR',section:'wallet',wide:true},
    {key:'otp',icon:'📲',motion:'motion-rocket',title:'OTP & PROXY',desc:'Thuê OTP SMS, Proxy xoay và Proxy tĩnh',section:'otp-center'},
    {key:'viptools',icon:'💎',motion:'motion-gem',title:'KHO VIP',desc:'Ưu đãi và sản phẩm VIP',section:'vip'},
    {key:'customer',icon:'👤',motion:'motion-chat',title:'TRUNG TÂM KHÁCH HÀNG',desc:'Thông tin, ví và tài khoản',section:'customer',wide:true},
    {key:'history',icon:'📜',motion:'motion-code',title:'LỊCH SỬ',desc:'Giao dịch và đơn hàng',section:'history'},
    {key:'ref',icon:'🎊',motion:'motion-gift',title:'GIỚI THIỆU REF',desc:'Link mời và hoa hồng',section:'ref'},
    {key:'group',icon:'💬',motion:'motion-chat',title:'NHÓM CHAT',desc:'Kết nối cộng đồng HENDY',section:'community'},
    {key:'news',icon:'📢',motion:'motion-bell',title:'KÊNH THÔNG BÁO',desc:'Tin tức và cập nhật',section:'community'},
    {key:'gift',icon:'🎟️',motion:'motion-gift',title:'GIFTCODE',desc:'Kích hoạt mã quà tặng',section:'gift'},
    {key:'support',icon:'🧑‍💻',motion:'motion-chat',title:'LIÊN HỆ CSKH',desc:'Tạo ticket hỗ trợ',section:'support'},
    {key:'vietsub',icon:'🎬',motion:'motion-game',title:'VIETSUB',desc:'Tạo yêu cầu xử lý video',section:'vietsub'}
  ];
  function memberName(){ return state.boot?.user?.name || state.boot?.user?.username || 'HENDY MEMBER'; }
  function renderHome(){
    const user=state.boot.user;
    const first=String(memberName()).split(' ')[0];
    $('#app').innerHTML = `
      <section class="hero hendy-showcase">
        <div class="hero-content">
          <div class="hero-kicker">💠 HENDY DIGITAL ECOSYSTEM · BOT ${botKey==='secondary'?'02':'01'}</div>
          <h1>Xin chào <span class="gradient-text">${escapeHtml(first)}</span>!</h1>
          <p>Công nghệ kết nối giá trị thật. Một hệ sinh thái dịch vụ công nghệ, Mini Game Live, Tool, Code, OTP, Proxy và tiện ích thành viên được đồng bộ theo từng bot HENDY.</p>
          <div class="hero-actions">
            <button class="btn primary" data-open="services">🚀 Khám phá dịch vụ</button>
            <button class="btn" data-open="customer">👤 Hồ sơ thành viên</button>
          </div>
        </div>
        <div class="orbit-stage" aria-hidden="true">
          <div class="orbit-ring ring-a"></div><div class="orbit-ring ring-b"></div>
          <div class="orbit-core"><span>💠</span></div>
          <span class="orbit-node n-rocket">🚀</span><span class="orbit-node n-rainbow">🌈</span>
          <span class="orbit-node n-gem">💎</span><span class="orbit-node n-bolt">⚡</span>
          <span class="orbit-node n-gift">🎁</span>
        </div>
      </section>
      <section class="wallets">
        <div class="wallet"><small>💰 VÍ CHÍNH</small><b>${money(user.balance)}</b></div>
        <div class="wallet"><small>🪙 VÍ NYC</small><b>${money(user.nycWallet)}</b></div>
        <div class="wallet"><small>🎟️ VÍ VOUCHER</small><b>${money(user.voucherWallet)}</b></div>
      </section>
      <div class="section-heading"><h2>🌈 HỆ SINH THÁI HENDY</h2><span>7 sắc màu · icon động</span></div>
      <section class="tiles">${tileData.map((tile,index)=>`
        <button class="tile ${tile.wide?'tile-wide':''}" style="--i:${index}" data-open="${tile.section}">
          <div class="tile-top"><span class="tile-icon"><span class="motion ${tile.motion}">${tile.icon}</span></span><span class="arrow">↗</span></div>
          <h3>${tile.title}</h3><p>${tile.desc}</p>
        </button>`).join('')}</section>
      <section class="panel">
        <h3>👑 THÀNH VIÊN HENDY</h3>
        <div class="row-card"><span class="muted small">Telegram ID</span><b>${escapeHtml(user.id)}</b></div>
        <div class="row-card"><span class="muted small">Hạng thành viên</span><span class="status">${Number(user.vipLevel||0)>0?'VIP '+user.vipLevel:'MEMBER'}</span></div>
        <div class="row-card"><span class="muted small">Tổng nạp</span><b>${money(user.totalDeposited)}</b></div>
        <div class="row-card"><span class="muted small">Bot đang kết nối</span><b>HENDY ${botKey==='secondary'?'BOT 2':'BOT 1'}</b></div>
      </section>`;
    setNav('home');
    syncMiniAppControls();
  }
  function setNav(nav){
    document.querySelectorAll('[data-nav]').forEach(btn=>btn.classList.toggle('active',btn.dataset.nav===nav));
  }
  function pageFrame(title,subtitle,body){
    $('#app').innerHTML = `<button class="back" data-open="home">← TRỞ VỀ HENDY</button>
      <div class="section-heading"><h2>${title}</h2><span>${subtitle||''}</span></div>${body}`;
    syncMiniAppControls();
  }
  async function loadProducts(category,title){
    state.section=category; setNav('services');
    pageFrame('⏳ ĐANG TẢI '+title,'Kho PostgreSQL','<div class="panel loading">Đang lấy sản phẩm và tồn kho thực tế...</div>');
    const data=await api('/api/products?category='+encodeURIComponent(category));
    state.products=data.products||[];
    const body=state.products.length?'<div class="product-list">'+state.products.map(product=>`
      <article class="product">
        <div><b>${escapeHtml(product.name)}</b><small>${escapeHtml(product.description||'')||'Dịch vụ HENDY'} · Kho: ${product.stock===null?'Có sẵn':Number(product.stock)}</small><small>Ví thanh toán: ${['otp','proxy'].includes(product.category)?'Ví NYC':'Ví Chính'} ${Number(product.vipLevel||0)>0?'· Yêu cầu VIP '+product.vipLevel:''}</small></div>
        <div style="text-align:right"><div class="price">${money(product.price)}</div><button class="btn primary" style="margin-top:8px" data-buy="${product.id}">MUA</button></div>
      </article>`).join('')+'</div>':'<div class="notice">Kho hiện chưa có sản phẩm đang bán. Admin có thể thêm sản phẩm trong Dashboard.</div>';
    pageFrame(title,'Giá và tồn kho đang lấy trực tiếp từ PostgreSQL',body);
  }
  async function loadWallet(){
    state.section='wallet';setNav('wallet');
    const [user,requests]=await Promise.all([api('/api/me'),api('/api/wallet/payment-requests')]);
    const u=user.user, list=requests.requests||[];
    pageFrame('💳 VÍ & NẠP TIỀN','VietQR · đối soát thủ công',`
      <section class="wallets"><div class="wallet"><small>VÍ CHÍNH</small><b>${money(u.balance)}</b></div><div class="wallet"><small>VÍ NYC</small><b>${money(u.nycWallet)}</b></div><div class="wallet"><small>VÍ VOUCHER</small><b>${money(u.voucherWallet)}</b></div></section>
      <div class="panel"><h3>＋ TẠO YÊU CẦU NẠP</h3><label class="form-label" for="deposit-amount">Số tiền (VNĐ)</label><input id="deposit-amount" class="field" type="number" min="10000" max="500000000" step="1000" value="50000"><button class="btn primary" data-action="deposit">TẠO QR VIETQR</button><p class="muted small">Ví chỉ được cộng sau khi Admin xác minh sao kê ngân hàng.</p><div id="payment-result"></div></div>

  async function loadCustomer(tab='active', refresh=true){
    state.section='customer';
    state.customerTab=tab;
    setNav('customer');
    if(refresh || !state.customerData){
      const [center,accounts,orders,payments,tickets,vouchers]=await Promise.all([
        api('/api/customer-center'),
        api('/api/linked-accounts'),
        api('/api/orders'),
        api('/api/wallet/payment-requests'),
        api('/api/support/tickets'),
        api('/api/vouchers')
      ]);
      state.customerData={center,accounts:accounts.accounts||[],orders:orders.orders||[],payments:payments.requests||[],tickets:tickets.tickets||[],vouchers};
      state.center=center;
      state.accounts=accounts.accounts||[];
    }
    renderCustomer();
  }

  }

        <button class="btn primary" data-action="vip-checkin" ${data.checkedInToday?'disabled':''}>🎁 ĐIỂM DANH HÔM NAY · +${Number(data.checkinPoints||0)} ĐIỂM</button>
      </div>
      <div class="panel"><h3>🎖️ CÁC MỐC VIP</h3>${(data.levels||[]).map(level=>`<div class="row-card"><b>${escapeHtml(level.name)}</b><span class="muted small">Tổng nạp từ ${money(level.threshold)}</span></div>`).join('')}</div>
      <div class="panel"><h3>GÓI VIP ĐANG MỞ</h3>${(data.products||[]).map(p=>`<div class="row-card"><div><b>${escapeHtml(p.name)}</b><small class="muted small" style="display:block">${escapeHtml(p.description||'')}</small></div><b>${money(p.price)}</b></div>`).join('')||'<p class="muted small">Chưa có gói VIP.</p>'}</div>`);
  }
  async function loadCommunity(){
    state.section='community';const settings=state.boot.settings||{};
    const group=settings.GROUP_URL||'https://t.me/Hendy_Support_Group';
    const channel=settings.CHANNEL_URL||'';
    pageFrame('💬 CỘNG ĐỒNG HENDY','Kết nối và nhận cập nhật',`
      <div class="panel"><h3>💬 NHÓM CHAT</h3><p class="muted small">Trao đổi, nhận hỗ trợ và thông tin dịch vụ.</p><a class="btn primary" target="_blank" rel="noopener" href="${escapeHtml(group)}">MỞ NHÓM CHAT</a></div>
      <div class="panel"><h3>📢 KÊNH THÔNG BÁO</h3><p class="muted small">Theo dõi tin tức và cập nhật dịch vụ HENDY.</p>${channel?'<a class="btn primary" target="_blank" rel="noopener" href="'+escapeHtml(channel)+'">MỞ KÊNH</a>':'<div class="notice">Kênh thông báo chưa được cấu hình.</div>'}</div>`);
  }
  function loadGift(){
    state.section='gift';pageFrame('🎟️ GIFTCODE','Nhập mã quà tặng',`
      <div class="panel"><h3>KÍCH HOẠT GIFTCODE</h3><label class="form-label">Mã quà tặng</label><input class="field" id="gift-code" maxlength="64" placeholder="NHẬP MÃ GIFTCODE"><button class="btn primary" data-action="redeem-gift">KÍCH HOẠT</button></div>`);
  }
  function loadSupport(){
    state.section='support';pageFrame('🧑‍💻 LIÊN HỆ CSKH','Tạo ticket hỗ trợ',`
      <div class="panel"><h3>GỬI YÊU CẦU HỖ TRỢ</h3><label class="form-label">Tiêu đề</label><input id="support-title" class="field" maxlength="120" placeholder="Mô tả ngắn vấn đề"><label class="form-label">Nội dung</label><textarea id="support-message" class="field" rows="4" maxlength="3000" placeholder="Nêu chi tiết yêu cầu cần hỗ trợ..."></textarea><button class="btn primary" data-action="send-support">GỬI TICKET</button></div>`);
  }
  function loadVietsub(){
    state.section='vietsub';pageFrame('🎬 DỊCH VỤ VIETSUB','Tạo job trong Telegram',`
      <div class="panel"><h3>VIDEO SUBTITLE SERVICE</h3><p class="muted small">Để giữ một luồng xử lý thống nhất giữa hai bot, hãy gửi URL video bằng lệnh /vietsub trong đúng bot này. Job sẽ gắn với BOT ${botKey==='secondary'?'2':'1'}.</p><button class="btn primary" data-action="open-bot">MỞ CUỘC TRÒ CHUYỆN TELEGRAM</button></div>`);
  }
  async function openSection(section){
    state.section=section;
    syncMiniAppControls();
    try {
      if(section==='home'){renderHome();return;}
      if(section!=='services'){
        const title=({
          wallet:'💳 VÍ & NẠP TIỀN',customer:'👤 TRUNG TÂM KHÁCH HÀNG',minigame:'🚀 MINIGAME LIVE',
          history:'📜 LỊCH SỬ HOẠT ĐỘNG',ref:'🎊 GIỚI THIỆU REF',vip:'👑 TRUNG TÂM VIP',
          community:'💬 CỘNG ĐỒNG HENDY',gift:'🎟️ GIFTCODE',support:'🧑‍💻 LIÊN HỆ CSKH',
          vietsub:'🎬 DỊCH VỤ VIETSUB',tools:'🧰 THUÊ TOOL',codes:'🎁 MUA CODE',
          otp:'📲 KHO OTP SMS',proxy:'🌐 KHO PROXY',viptools:'💎 KHO VIP','otp-center':'📲 OTP & PROXY CENTER'
        })[section]||'DỊCH VỤ HENDY';
        pageFrame('⏳ '+title,'Đang tải dữ liệu trực tiếp từ máy chủ…','<div class="panel loading" role="status" aria-live="polite">🌈 Đang xử lý yêu cầu của bạn...</div>');
        await new Promise(resolve=>requestAnimationFrame(()=>resolve()));
      }
      if(section==='services'){pageFrame('🌈 DỊCH VỤ HENDY','Chọn nhóm dịch vụ','<section class="tiles">'+tileData.map((tile,i)=>'<button class="tile" style="--i:'+i+'" data-open="'+tile.section+'"><div class="tile-icon">'+tile.icon+'</div><h3>'+tile.title+'</h3><p>'+tile.desc+'</p></button>').join('')+'</section>');setNav('services');return;}
      if(section==='wallet'){await loadWallet();return;}
      if(section==='customer'){await loadCustomer();return;}
      if(section==='minigame'){await loadAccounts();return;}
      if(section==='otp-center'){
        state.section='otp-center';setNav('services');
        pageFrame('📲 OTP & PROXY CENTER','Ví NYC · dịch vụ số',`
          <div class="wallets"><div class="wallet"><small>🪙 VÍ NYC</small><b>${money(state.boot.user.nycWallet)}</b></div><div class="wallet"><small>💰 VÍ CHÍNH</small><b>${money(state.boot.user.balance)}</b></div><div class="wallet"><small>👑 VIP</small><b>${Number(state.boot.user.vipLevel||0)}</b></div></div>
          <section class="tiles">
            <button class="tile" data-open="otp"><div class="tile-icon">📲</div><h3>THUÊ OTP SMS</h3><p>Chọn dịch vụ và xem giá.</p></button>
            <button class="tile" data-open="proxy"><div class="tile-icon">🌐</div><h3>PROXY CENTER</h3><p>Proxy xoay, tĩnh và kho đã thuê.</p></button>
            <button class="tile tile-wide" data-open="history"><div class="tile-icon">📜</div><h3>LỊCH SỬ GIAO DỊCH</h3><p>Tra cứu đơn hàng OTP, Proxy và biến động ví.</p></button>
          </section>
          <div class="panel"><h3>🪙 NẠP VÍ NYC</h3><p class="muted small">Chuyển nội bộ từ Ví Chính sang Ví NYC bằng menu OTP & Proxy trong cuộc trò chuyện Telegram. Việc chuyển ví được ghi vào sổ cái PostgreSQL.</p><button class="btn" data-action="open-bot">MỞ BOT ĐỂ CHUYỂN VÍ NYC</button></div>`);
        return;
      }
      if(section==='history'){await loadHistory();return;}
      if(section==='ref'){await loadReferrals();return;}
      if(section==='vip'){await loadVip();return;}
      if(section==='community'){await loadCommunity();return;}
      if(section==='gift'){loadGift();return;}
      if(section==='support'){loadSupport();return;}
      if(section==='vietsub'){loadVietsub();return;}
      const categories={tools:['tools','🧰 THUÊ TOOL'],codes:['codes','🎁 MUA CODE'],otp:['otp','📲 KHO OTP SMS'],proxy:['proxy','🌐 KHO PROXY']};
      if(categories[section]){await loadProducts(...categories[section]);return;}
      if(section==='viptools'){await loadProducts('vip','💎 KHO VIP');return;}
      throw new Error('Mục chức năng chưa được triển khai.');
    } catch(error) { showToast(error.message || 'Không thể tải dữ liệu.'); }
  }
  async function createOrder(id){
    const result=await api('/api/orders',{method:'POST',body:{productId:String(id)}});
    showToast(result.message||'Đã tạo đơn hàng.');
    await loadProducts(state.section, state.section.toUpperCase());
  }
  async function handleAction(action){
    if(action==='deposit'){await createDeposit();return;}
    if(action==='link-account'){await linkAccount();return;}
    if(action==='vip-checkin'){const data=await api('/api/vip/checkin',{method:'POST',body:{}});showToast(data.message||'Điểm danh thành công.');await loadVip();return;}
    if(action==='copy-ref'){const value=$('#ref-link')?.value||'';if(!value)throw new Error('Chưa có link giới thiệu.');if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(value);else{const input=$('#ref-link');input.select();document.execCommand('copy');}showToast('Đã sao chép link giới thiệu.');return;}
    if(action==='redeem-gift'){const code=$('#gift-code')?.value.trim()||'';const data=await api('/api/giftcodes/redeem',{method:'POST',body:{code}});showToast(data.message||'Đã kích hoạt Giftcode.');await loadCustomer();return;}
    if(action==='support-abuse'){await openCustomerSupport('dinh_lam');return;}
    if(action==='support-general'){await openCustomerSupport('support');return;}
    if(action==='open-vouchers'){await openCustomerVouchers();return;}
    if(action==='send-support'){
      const subject=$('#support-title')?.value.trim()||'',message=$('#support-message')?.value.trim()||'';
      const ticketType=state.supportTicketType==='dinh_lam'?'dinh_lam':'support';
      const data=await api('/api/support/tickets',{method:'POST',body:{ticketType,subject,message}});
      showToast(data.message||'Đã tạo ticket.');
      await openCustomerSupport(ticketType);
      return;
    }
    if(action==='submit-voucher'){
      const orderId=Number($('#voucher-order')?.value||0),reason=$('#voucher-reason')?.value.trim()||'';
      if(!orderId||reason.length<5)throw new Error('Chọn đơn hàng và nhập lý do ít nhất 5 ký tự.');
      const data=await api('/api/vouchers',{method:'POST',body:{orderId,reason}});
      showToast(data.message||'Đã gửi yêu cầu Voucher.');
      state.customerData=null;
      await loadCustomer('active',true);
      return;
    }
    if(action==='open-bot'){
      const link=typeof state.boot.botUrl==='string'?state.boot.botUrl:'';
      if(link){
        if(tg?.openTelegramLink)tg.openTelegramLink(link);
        else window.open(link,'_blank','noopener');
      } else {
        showToast('Chưa cấu hình liên kết Telegram Bot công khai.');
      }
      return;
    }
  }
  $('#app').addEventListener('click',async event=>{
    const customerTab=event.target.closest('[data-customer-tab]');
    if(customerTab){
      document.querySelectorAll('[data-customer-tab]').forEach(button=>button.classList.toggle('active',button===customerTab));
      state.customerTab=customerTab.dataset.customerTab;
      hapticSelection();
      renderCustomer();
      return;
    }
    const buy=event.target.closest('[data-buy]');
    const del=event.target.closest('[data-delete-account]');
    const open=event.target.closest('[data-open]');
    const action=event.target.closest('[data-action]');
    const pressed=event.target.closest('button:not(:disabled)');
    if(pressed)hapticImpact('light');
    const originalBuyText=buy?.textContent||'';
    const originalActionText=action?.textContent||'';
    try{
      if(buy){buy.disabled=true;buy.textContent='ĐANG XỬ LÝ…';await createOrder(buy.dataset.buy);return;}
      if(del){del.disabled=true;del.textContent='ĐANG XÓA…';await deleteAccount(del.dataset.deleteAccount);return;}
      if(open){await openSection(open.dataset.open);return;}
      if(action){action.disabled=true;action.textContent='ĐANG XỬ LÝ…';await handleAction(action.dataset.action);}
    }catch(error){showToast(error.message||'Thao tác thất bại.','error');}
    finally{
      if(buy && buy.isConnected){buy.disabled=false;buy.textContent=originalBuyText;}
      if(del && del.isConnected){del.disabled=false;del.textContent='XÓA';}
      if(action && action.isConnected){action.disabled=false;action.textContent=originalActionText;}
    }
  });
  document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>openSection(btn.dataset.nav)));
  async function renderWebsiteLogin() {
    let identities = {};
    try {
      const response = await fetch('/api/v1/public/config', {headers:{Accept:'application/json'},cache:'no-store'});
      if (response.ok) identities = await response.json();
    } catch (_) {}
    const primaryBotUrl = typeof identities.botUrl === 'string' ? identities.botUrl.trim() : '';
    const secondaryBotUrl = typeof identities.secondaryBotUrl === 'string' ? identities.secondaryBotUrl.trim() : '';
    const withLoginStart = url => url ? url + (url.includes('?') ? '&' : '?') + 'start=web_login' : '';
    const primaryUrl = withLoginStart(primaryBotUrl);
    const secondaryUrl = withLoginStart(secondaryBotUrl);
    const selectedUrl = botKey === 'secondary' ? secondaryUrl : primaryUrl;
    const selectedLabel = botKey === 'secondary' ? 'BOT DỰ PHÒNG' : 'BOT CHÍNH';
    const otherUrl = botKey === 'secondary' ? primaryUrl : secondaryUrl;
    const otherLabel = botKey === 'secondary' ? 'BOT CHÍNH' : 'BOT DỰ PHÒNG';
    const loginButtons = [
      selectedUrl ? '<a class="btn primary" href="' + escapeHtml(selectedUrl) + '" target="_blank" rel="noopener noreferrer">🔐 ĐĂNG NHẬP QUA ' + selectedLabel + '</a>' : '',
      otherUrl ? '<a class="btn" href="' + escapeHtml(otherUrl) + '" target="_blank" rel="noopener noreferrer">↗ ĐĂNG NHẬP QUA ' + otherLabel + '</a>' : ''
    ].filter(Boolean).join('');
    $('#bot-chip').textContent = 'HENDY WEBSITE · ĐĂNG NHẬP';
    $('#app').innerHTML = `
      <section class="hero hendy-showcase website-login-hero">
        <div class="hero-content">
          <div class="hero-kicker">💠 HENDY DIGITAL ECOSYSTEM</div>
          <h1>Chào mừng đến với <span class="gradient-text">HENDY.</span></h1>
          <p>Website chính thức quản lý dịch vụ, đơn hàng, số dư và tài khoản liên kết. Đăng nhập bằng Telegram để tiếp tục trên cùng giao diện HENDY — không cần cài thêm ứng dụng riêng.</p>
          <div class="hero-actions">${loginButtons || '<span class="notice error">Đường dẫn đăng nhập Telegram chưa được cấu hình. Vui lòng liên hệ CSKH.</span>'}</div>
          <div class="notice">Quy trình: mở bot → Telegram gửi link đăng nhập riêng → mở link trong 5 phút. Link chỉ dùng một lần; website nhận cookie bảo mật sau khi máy chủ xác minh.</div>
        </div>
        <div class="orbit-stage" aria-hidden="true">
          <div class="orbit-ring ring-a"></div><div class="orbit-ring ring-b"></div><div class="orbit-core"><span>💠</span></div>
          <span class="orbit-node n-rocket">🚀</span><span class="orbit-node n-rainbow">🌈</span><span class="orbit-node n-gem">💎</span><span class="orbit-node n-bolt">⚡</span><span class="orbit-node n-gift">🎁</span>
        </div>
      </section>
      <section class="tiles">
        <article class="tile"><div class="tile-icon">🚀</div><h3>MINIGAME LIVE</h3><p>Dịch vụ và tài khoản liên kết.</p></article>
        <article class="tile"><div class="tile-icon">🧰</div><h3>TOOL & CODE</h3><p>Quản lý sản phẩm và đơn hàng.</p></article>
        <article class="tile"><div class="tile-icon">💳</div><h3>VÍ & GIAO DỊCH</h3><p>VietQR, lịch sử và các loại ví.</p></article>
        <article class="tile"><div class="tile-icon">💎</div><h3>VIP & ƯU ĐÃI</h3><p>Quyền lợi và điểm thành viên.</p></article>
      </section>`;
  }

  async function start(){
    initTelegramMiniApp();
    $('#bot-chip').textContent = tg && tg.initData ? (botKey==='secondary'?'BOT 2 · MINI APP':'BOT 1 · MINI APP') : 'HENDY WEBSITE';
    try{
      state.boot=await api('/api/bootstrap');
      localStorage.setItem('hendy_bot_key', botKey);
      if(state.boot.botKey!==botKey)throw new Error('Phiên đăng nhập thuộc bot khác. Hãy mở đúng địa chỉ website BOT 1 hoặc BOT 2.');
      if(params.get('view')==='customer' || ['/customer','/customer/','/customer-center','/customer-center/','/miniapp','/miniapp/','/mini-app','/mini-app/','/app','/app/'].includes(location.pathname.toLowerCase()) || location.pathname.toLowerCase().includes('/khach-hang/trung-tam-khach-hang/')){
        await loadCustomer('active',true);
      }else{
        renderHome();
      }
      connectWebsiteRealtime();
    }catch(error){
      if(!tg || !tg.initData){renderWebsiteLogin();return;}
      $('#app').innerHTML='<div class="notice error">Không thể xác thực tài khoản Telegram: '+escapeHtml(error.message)+'<br>Hãy mở lại Mini App HENDY từ đúng bot.</div>';
      syncMiniAppControls();
    }
  }
  window.addEventListener('beforeunload',()=>{
    realtimeStopped=true;
    window.clearTimeout(realtimeRetry);
    window.clearInterval(realtimeHeartbeat);
    if(realtimeSocket)realtimeSocket.close();
  });
  start();
})();
</script>
