# Render Blueprint for the existing HENDY-BOT-CYBERTECH web service.
# DATABASE_URL is managed separately (current service uses an external PostgreSQL URL).
# This Blueprint deliberately does not create or attach another application's database.
services:
  - type: web
    name: HENDY-BOT-CYBERTECH
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /var/www/app/docker/start.sh
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: DB_STARTUP_WAIT_SECONDS
        value: "120"
      - key: BOT1_TOKEN
        sync: false
      - key: BOT2_TOKEN
        sync: false
      - key: BOT1_PUBLIC_URL
        sync: false
      - key: BOT2_PUBLIC_URL
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_SECOND_WEBHOOK_SECRET
        generateValue: true
      - key: BANK_WEBHOOK_ENABLED
        value: "false"
      - key: WEBHOOK_AUTO_REGISTER
        value: "true"
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "3600"
      - key: ALLOWED_ORIGINS
        value: https://hendy-bot-cybertech.onrender.com
      - key: VIETQR_BANK_ID
        sync: false
      - key: VIETQR_ACCOUNT_NO
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        sync: false
      - key: GROUP_URL
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: SUPPORT_URL
        sync: false
      - key: LEGACY_SESSION_SECRET
        generateValue: true
      - key: WEBSOCKET_ENABLED
        value: "true"
      - key: WEBSOCKET_URL
        value: wss://hendy-bot-cybertech.onrender.com/ws
      - key: WEBSOCKET_ALLOWED_ORIGINS
        value: https://hendy-bot-cybertech.onrender.com
      - key: WEBSOCKET_MAX_CONNECTIONS
        value: "250"
      - key: WEBSOCKET_BIND
        value: 127.0.0.1
      - key: WEBSOCKET_PORT
        value: "10001"
