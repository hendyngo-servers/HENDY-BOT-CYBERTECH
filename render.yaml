# Render Blueprint — PHP 8.3 + Apache + PostgreSQL.
# PHP chạy qua Docker vì Render không cung cấp native PHP runtime.
services:
  - type: web
    name: hendy-bot-tele
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: hendy-module-storage
      mountPath: /var/www/app/storage
      sizeGB: 1
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: BOT1_TOKEN
        sync: false
      - key: BOT2_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hendy-bot-tele-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_SECOND_WEBHOOK_SECRET
        generateValue: true
      - key: BANK_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "86400"
      - key: BOT_USERNAME
        sync: false
      - key: VIETQR_BANK_ID
        sync: false
      - key: VIETQR_ACCOUNT_NO
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        sync: false
      - key: GROUP_URL
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: LEGACY_SESSION_SECRET
        generateValue: true
      - key: WEBSOCKET_URL
        sync: false
  - type: web
    name: hendy-bot-tele-realtime
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php bin/websocket.php
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hendy-bot-tele-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: ADMIN_ID
        sync: false
      - key: WEBSOCKET_BIND
        value: 0.0.0.0
      - key: WEBSOCKET_PORT
        value: "10000"

databases:
  - name: hendy-bot-tele-db
    databaseName: hendy_bot_tele
    user: hendy_bot_tele
    plan: basic-256mb
    region: singapore
