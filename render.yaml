# Render Blueprint — PHP 8.3 + Apache + PostgreSQL.
# Web services and PostgreSQL must share a region to use the Internal Database URL.
services:
  - type: web
    name: hendy-bot-tele
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Explicitly overrides any stale Docker Command saved in the Dashboard.
    dockerCommand: /var/www/app/docker/start.sh
    disk:
      name: hendy-module-storage
      mountPath: /var/www/app/storage
      sizeGB: 1
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: DB_STARTUP_WAIT_SECONDS
        value: "120"
      - key: BOT1_TOKEN
        sync: false
      - key: BOT2_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hendy-bot-tele-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_SECOND_WEBHOOK_SECRET
        generateValue: true
      - key: BANK_WEBHOOK_ENABLED
        value: "false"
      - key: WEBHOOK_AUTO_REGISTER
        value: "true"
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "86400"
      - key: BOT_USERNAME
        value: HendyBot_Bot
      - key: BOT1_USERNAME
        value: HendyBot_Bot
      - key: BOT2_USERNAME
        value: hendymono_bot
      - key: BOT1_DISPLAY_NAME
        value: HENDY BOT CHÍNH
      - key: BOT2_DISPLAY_NAME
        value: HENDY BOT THỬ NGHIỆM
      - key: VIETQR_BANK_ID
        sync: false
      - key: VIETQR_ACCOUNT_NO
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        sync: false
      - key: GROUP_URL
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: LEGACY_SESSION_SECRET
        generateValue: true
      - key: WEBSOCKET_ENABLED
        value: "true"
      - key: WEBSOCKET_URL
        value: wss://hendy-bot-tele.onrender.com/ws
      - key: WEBSOCKET_ALLOWED_ORIGINS
        value: https://hendy-bot-tele.onrender.com
      - key: WEBSOCKET_MAX_CONNECTIONS
        value: "250"
      - key: WEBSOCKET_BIND
        value: 127.0.0.1
      - key: WEBSOCKET_PORT
        value: "10001"

databases:
  - name: hendy-bot-tele-db
    databaseName: hendy_bot_tele
    user: hendy_bot_tele
    plan: basic-256mb
    region: singapore
