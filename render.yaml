# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Blueprint cho Hendy Bot Tele: một Web Service + PostgreSQL Managed tại Singapore.

services:
  - type: web
    name: hendy-bot-tele
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: BOT_SECOND_TOKEN
        sync: false
      - key: BOT_SECOND_ADMIN_ID
        sync: false
      - key: BOT_SECOND_USERNAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hendy-bot-tele-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: PGPOOL_MAX
        value: "10"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_SECOND_WEBHOOK_SECRET
        generateValue: true
      - key: BANK_WEBHOOK_SECRET
        generateValue: true
      - key: LEGACY_ACCOUNT_URL
        sync: false
      - key: LEGACY_SESSION_SECRET
        generateValue: true
      - key: BOT_USERNAME
        sync: false

databases:
  - name: hendy-bot-tele-db
    databaseName: hendy_bot_tele
    user: hendy_bot_tele
    plan: basic-256mb
    region: singapore
